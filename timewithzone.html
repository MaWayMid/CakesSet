<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实时时间显示</title>
    <style>
        @font-face {
            font-family: 'SourceHanSansCN-Normal';
            src: url('思源黑体 SourceHanSansSC-Normal.otf'); /* 确保字体文件和 HTML 在同一目录 */
        }

        body {
            margin: 0;
            background-color: rgba(0, 0, 0, 0); /* 透明背景 */
            overflow: hidden;
        }

        #clock {
            font-family: 'SourceHanSansCN-Normal', sans-serif;
            font-size: 50px;
            color: rgba(255, 255, 255, 0.5);
            text-shadow: 
                -2px -2px 0 rgba(63, 72, 205, 0.5),  
                 2px -2px 0 rgba(63, 72, 205, 0.5),  
                -2px  2px 0 rgba(63, 72, 205, 0.5),  
                 2px  2px 0 rgba(63, 72, 205, 0.5); /* 白色描边 */
            text-align: center;
            position: absolute;
            width: 100%;
            top: 50%;
            transform: translateY(-50%);
            white-space: pre-line;
        }
    </style>
</head>
<body>
    <div id="clock"></div>

    <script>
        function updateClock() {
            const now = new Date();
            const options = {
                timeZone: 'Asia/Shanghai',
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            };
            const formatter = new Intl.DateTimeFormat('zh-CN', options);
            const formattedTime = formatter.format(now);
            document.getElementById('clock').textContent ='UTC+8 ' + formattedTime + '\n' + ' Waymid Ma 马玮民';
        }

        setInterval(updateClock, 1000);
        updateClock(); // 立即更新时间
    </script>
</body>
</html>
